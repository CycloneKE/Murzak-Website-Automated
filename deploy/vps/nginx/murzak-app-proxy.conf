# /etc/nginx/snippets/murzak-app-proxy.conf
#
# Shared proxy body for Coolify-provisioned customer app vhosts.
# Included by the per-host files that murzak-app-vhost generates.
#
# Everything here is host-agnostic: proxy_ssl_name uses $host, so Traefik
# receives the right SNI without this snippet needing to know the hostname.
# Traefik routes on the Host header and terminates with its own self-signed
# default cert, which is why proxy_ssl_verify is off — that hop never leaves
# the loopback interface.

client_max_body_size 0;

location / {
    proxy_pass https://127.0.0.1:7443;

    proxy_ssl_server_name on;
    proxy_ssl_name        $host;
    proxy_ssl_verify      off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $murzak_apps_connection_upgrade;

    proxy_redirect off;

    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 30s;
}
