# /etc/nginx/conf.d/00-murzak-apps-map.conf
#
# Websocket upgrade map shared by the Murzak app vhosts (the wildcard :80 front
# door and every per-host :443 vhost that murzak-app-vhost generates).
#
# Lives in conf.d/ with a 00- prefix on purpose: nginx.conf includes conf.d/*
# before sites-enabled/*, so this map is always defined before anything
# references it. Inside sites-enabled the glob would order "app-<host>" ahead
# of "apps.murzaktech.tech", putting the consumers before the definition.

map $http_upgrade $murzak_apps_connection_upgrade {
    default upgrade;
    ''      close;
}
