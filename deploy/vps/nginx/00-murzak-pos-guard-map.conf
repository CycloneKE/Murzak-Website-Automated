# /etc/nginx/conf.d/00-murzak-pos-guard-map.conf
#
# Classifies every request to a Murzak POS API method, for
# snippets/murzak-pos-guard.conf to act on. Lives in conf.d/ with a 00- prefix
# for the same reason as 00-murzak-apps-map.conf: conf.d/* is included before
# sites-enabled/*, so the map exists before any vhost references it.
#
# The app was renamed from techsavanna_pos to murzak_pos. Both names are
# accepted below, so a shop is protected whichever release its site is on.
# Once no site uses the old name any more, "techsavanna_pos|" can be removed.
#
# WHY THIS EXISTS
#   The app whitelists many methods with allow_guest=True, not just
#   sign-in, but create_purchase_order, pay_purchase_invoice,
#   create_stock_entry, inventory reports, bulk_upload_products and
#   register_user (which grants System Manager). On a customer's private site
#   that lets anyone on the internet write to, or read, that shop's books.
#   Until the app itself is fixed, the front door refuses them.
#
# THE RULE
#   blocked  never served on a tenant: self-sign-up (the owner account is made
#            at provisioning, staff are added by the owner) and the
#            verification-code senders that only sign-up uses (SMS/email spam
#            relay otherwise).
#   public   genuinely needed before sign-in: signing in, and the two
#            forgotten-password methods so staff can reset their own password.
#            Those two are safe to expose: they are rate limited, answer the
#            same whether or not an account exists, send the code only to the
#            address on the account, and lock after wrong guesses.
#            Also public: the online-store calls a shopper or WooCommerce makes
#            with no login. WooCommerce cannot send an Authorization header,
#            so the order webhook is public here and the app itself checks the
#            secret in the address and the HMAC signature before it accepts an
#            order. The storefront calls are guest-by-design (rate limited,
#            prices set server side); order tracking needs the order's private
#            token. Deployed servers must carry this line too: the file is
#            copied by hand, so re-copy it after changing it.
#   private  everything else in the app: must carry an Authorization
#            header. Frappe answers an invalid token with 401, it does NOT
#            fall back to Guest (verified 2026-10-08 against api.pos with a
#            bogus Bearer and a bogus `token a:b`), so requiring the header
#            is enough to require a real login.
#
# Regex map entries are tried in order; the first match wins. $uri is already
# percent-decoded and slash-merged by nginx, so encoded variants cannot slip
# past.

map $uri $murzak_pos_method_class {
    default "";

    ~^/api/(v\d+/)?method/(techsavanna_pos|murzak_pos)\.api\.(auth_api|auth)\.register_user   blocked;
    ~^/api/(v\d+/)?method/(techsavanna_pos|murzak_pos)\.api\.verification_api\.               blocked;

    ~^/api/(v\d+/)?method/(techsavanna_pos|murzak_pos)\.api\.(auth_api\.(login_user|loginuser)|auth\.login_user|industry_api\.get_pos_industries|product_seeding\.get_pos_industries|onboarding_api\.check_abbreviation_exists)$   public;
    ~^/api/(v\d+/)?method/(techsavanna_pos|murzak_pos)\.api\.password_reset\.(request_password_reset|reset_password_with_code)$   public;

    ~^/api/(v\d+/)?method/murzak_pos\.api\.(online_webhooks\.woocommerce_order|storefront_api\.(get_store|list_products|get_product|quote_delivery|checkout|pay_for_order)|online_orders\.track_online_order)$   public;
    ~^/api/(v\d+/)?method/(techsavanna_pos|murzak_pos)\.                                      private;
}

# "private" + no Authorization header = refuse. Keyed on both so the snippet
# needs a single `if`.
map "$murzak_pos_method_class:$http_authorization" $murzak_pos_guard {
    default        "";
    ~^blocked:     blocked;
    "private:"     unauthenticated;
}
