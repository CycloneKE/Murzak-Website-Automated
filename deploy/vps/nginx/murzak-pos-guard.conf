# /etc/nginx/snippets/murzak-pos-guard.conf
#
# Include at server level in every vhost that fronts a CUSTOMER'S OWN Frappe
# site with techsavanna_pos installed (pos-tenants-wildcard,
# erp-tenants-wildcard). See conf.d/00-murzak-pos-guard-map.conf for what is
# refused and why.
#
# NOT for pos.murzaktech.tech / api.pos.murzaktech.tech: that shared site is
# where public sign-up is the product.

if ($murzak_pos_guard = blocked) {
    return 403 '{"message":"Sign-up is not available on this POS. The owner login is in your Murzak portal; staff accounts are added by the owner."}';
}
if ($murzak_pos_guard = unauthenticated) {
    return 401 '{"message":"Please sign in to continue."}';
}
